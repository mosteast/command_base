version: 1
rule:
  - id: jetbrains_cache
    path: "~/Library/Caches/JetBrains"
    kind: cache
    risk: low
    action: delete
    min_size: 100M
    enabled: true
    note: "IDE rebuildable cache"

  - id: cocoapods_cache
    path: "~/Library/Caches/CocoaPods"
    kind: cache
    risk: low
    action: delete
    min_size: 100M
    enabled: true
    note: "CocoaPods cache"

  - id: google_cache
    path: "~/Library/Caches/Google"
    kind: cache
    risk: low
    action: delete
    min_size: 100M
    enabled: true
    note: "Google app cache"

  - id: playwright_cache
    path: "~/Library/Caches/ms-playwright"
    kind: cache
    risk: low
    action: delete
    min_size: 100M
    enabled: true
    note: "Playwright browser cache"

  - id: pip_cache
    path: "~/Library/Caches/pip"
    kind: cache
    risk: low
    action: delete
    min_size: 50M
    enabled: true
    note: "pip download cache"

  - id: yarn_cache
    path: "~/Library/Caches/Yarn"
    kind: cache
    risk: low
    action: delete
    min_size: 50M
    enabled: true
    note: "Yarn cache"

  - id: homebrew_cache
    path: "~/Library/Caches/Homebrew"
    kind: cache
    risk: low
    action: delete
    min_size: 50M
    enabled: true
    note: "Homebrew bottle cache"

  - id: npm_cache
    path: "~/.npm/_cacache"
    kind: cache
    risk: low
    action: delete
    min_size: 100M
    enabled: true
    note: "npm content-addressed cache; refills on demand"

  - id: npm_npx
    path: "~/.npm/_npx"
    kind: cache
    risk: low
    action: delete
    min_size: 100M
    enabled: true
    note: "npx transient package installs"

  - id: gradle_cache
    path: "~/.gradle/caches"
    kind: cache
    risk: low
    action: delete
    min_size: 100M
    enabled: true
    note: "Gradle build cache; re-downloaded on next build"

  - id: dot_cache_uv
    path: "~/.cache/uv"
    kind: cache
    risk: low
    action: delete
    min_size: 100M
    enabled: true
    note: "uv package cache"

  - id: dot_cache
    path: "~/.cache"
    kind: cache
    risk: medium
    action: report
    min_size: 100M
    enabled: true
    note: "Umbrella for ~/.cache; holds model weights, inspect before deleting"

  - id: dot_cache_whisper
    path: "~/.cache/whisper"
    kind: artifact
    risk: medium
    action: report
    min_size: 100M
    enabled: true
    note: "Whisper model weights; deleting forces a re-download"

  - id: idea_hprof
    glob: "~/java_error_in_idea.hprof"
    kind: artifact
    risk: low
    action: trash
    enabled: true
    note: "IntelliJ crash dump"

  - id: xcode_device_support
    path: "~/Library/Developer/Xcode/iOS DeviceSupport"
    kind: cache
    risk: low
    action: delete
    min_size: 1G
    enabled: true
    note: "Symbols for iOS versions you no longer debug"

  - id: simulator_devices
    path: "~/Library/Developer/CoreSimulator/Devices"
    kind: large_file
    risk: high
    action: report
    min_size: 1G
    enabled: true
    note: "Simulator app data; prefer cleanup_xcode --sim-unavailable"

  - id: docker_raw
    path: "~/Library/Containers/com.docker.docker/Data/vms/0/data/Docker.raw"
    kind: large_file
    risk: high
    action: report
    min_size: 1G
    enabled: true
    note: "Docker VM disk; reclaim with: docker system prune -a -f && docker builder prune -f"

  - id: cursor_state_vscdb
    path: "~/Library/Application Support/Cursor/User/globalStorage/state.vscdb"
    kind: large_file
    risk: high
    action: report
    min_size: 500M
    enabled: true
    note: "Cursor state database; quit Cursor before removing"

  - id: cursor_state_vscdb_backup
    path: "~/Library/Application Support/Cursor/User/globalStorage/state.vscdb.backup"
    kind: large_file
    risk: high
    action: report
    min_size: 500M
    enabled: true
    note: "Cursor state database backup"

  - id: cursor_snapshots
    path: "~/Library/Application Support/Cursor/snapshots"
    kind: artifact
    risk: medium
    action: trash
    min_size: 1G
    enabled: true
    note: "Cursor local timeline snapshots; safe to drop when Cursor is closed"

  - id: claude_vm_bundle
    path: "~/Library/Application Support/Claude-3p/vm_bundles"
    kind: large_file
    risk: high
    action: report
    min_size: 1G
    enabled: true
    note: "Claude local VM images; removed with the app"

  - id: wechat_container
    path: "~/Library/Containers/com.tencent.xinWeChat"
    kind: large_file
    risk: high
    action: report
    min_size: 1G
    enabled: true
    note: "WeChat data and caches; clear from the app settings"

  - id: ios_simulator_runtime
    path: "/System/Volumes/Data/System/Library/AssetsV2/com_apple_MobileAsset_iOSSimulatorRuntime"
    kind: large_file
    risk: high
    action: report
    min_size: 1G
    enabled: true
    note: "iOS simulator runtimes; remove old versions in Xcode Settings > Platforms"

  - id: system_developer_library
    path: "/Library/Developer"
    kind: large_file
    risk: high
    action: report
    min_size: 1G
    enabled: true
    note: "Shared Xcode/CommandLineTools support; needs sudo to clean"

  - id: icloud_saved_video
    path: "~/Library/Mobile Documents/com~apple~CloudDocs/main/saved/video"
    kind: large_file
    risk: high
    action: report
    min_size: 1G
    enabled: true
    note: "iCloud saved video library"

  - id: code_base_home
    path: "~/code_base"
    kind: large_file
    risk: high
    action: report
    min_size: 1G
    enabled: true
    note: "Local code workspace; check duplicated worktree node_modules"

  - id: dev_cache_bundle
    kind: delegate
    risk: low
    action: delegate
    enabled: true
    delegate_to: cleanup_dev_cache
    delegate_args:
      - report
      - --profile
      - xcode
      - --profile
      - temp_cache
    note: "Delegate read-only report to cleanup_dev_cache"
